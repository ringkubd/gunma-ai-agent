# Chatwoot self-hosted — unifies WhatsApp / Facebook / Instagram / Email / Website chat.
# Piku (anwar/gunma-ai-agent) auto-replies via webhook → /api/chat/webhook/chatwoot.
#
# Run:  cd ~/chatwoot && docker compose up -d
# Docs: https://www.chatwoot.com/docs/self-hosted/deployment/docker

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  web:
    image: chatwoot/chatwoot:latest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &chatwoot_env
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-https://support.gunmahalalfood.com}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?set a strong SECRET_KEY_BASE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_strong_password}
      - REDIS_URL=redis://redis:6379
      - DEFAULT_LOCALE=ja
      - ENABLE_ACCOUNT_SIGNUP=false
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-Gunma Support <support@gunmahalalfood.com>}
    volumes:
      - web-storage:/app/storage

  worker:
    image: chatwoot/chatwoot:latest
    restart: always
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: *chatwoot_env
    volumes:
      - web-storage:/app/storage

volumes:
  postgres-data:
  redis-data:
  web-storage:
