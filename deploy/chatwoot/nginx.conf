# Chatwoot reverse proxy + WebSocket (ActionCable).
# Place at /etc/nginx/sites-available/support.gunmahalalfood.com and symlink into sites-enabled.
# Generate the certificate first: sudo certbot --nginx -d support.gunmahalalfood.com

upstream chatwoot_web {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name support.gunmahalalfood.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name support.gunmahalalfood.com;

    ssl_certificate     /etc/letsencrypt/live/support.gunmahalalfood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.gunmahalalfood.com/privkey.pem;

    client_max_body_size 50m;

    # ActionCable WebSocket
    location /cable {
        proxy_pass http://chatwoot_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Web app / API
    location / {
        proxy_pass http://chatwoot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
